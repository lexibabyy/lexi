# ============================================================
# MetaTrader 5 Automated Trading Bot - Configuration
# ============================================================
# Copy this file and adjust values to suit your account and
# risk appetite. NEVER commit real credentials to git.
# ============================================================

account:
  # Leave login/password/server empty to attach to an already
  # running, logged-in MT5 terminal. Fill them to log in
  # programmatically.
  login:                     # e.g. 12345678
  password:                  # your account password
  server:                    # e.g. "MetaQuotes-Demo"
  # Path to terminal64.exe (optional, only if auto-detect fails)
  terminal_path:

trading:
  symbol: "XAUUSD"           # instrument to trade (gold)
  timeframe: "M5"            # M1, M5, M15, M30, H1, H4, D1
  magic_number: 532023       # unique id to tag this bot's trades
  deviation: 30              # max slippage in points (gold needs a bit more)
  # How often the bot wakes up to evaluate the market (seconds).
  poll_interval_seconds: 15
  # Maximum number of simultaneous open positions (multiple entries).
  # Kept low for a small cent account so stacked gold trades can't
  # margin-call it. Raise only once you have more balance.
  max_open_positions: 2

risk:
  # Percentage of account equity risked per trade (used to size
  # the lot relative to the stop-loss distance).
  # NOTE: tuned for a small CENT account (~1000 cents balance). On such a
  # tiny balance the broker's minimum lot will usually risk MORE than this
  # target; the sizer then falls back to min_lot. Keep max_lot at min_lot
  # so it can never oversize.
  risk_per_trade_pct: 2.0
  # Stop-loss / take-profit expressed as ATR multiples.
  atr_period: 14
  stop_loss_atr_mult: 1.5
  take_profit_atr_mult: 3.0
  # Hard caps so a bad config can never blow the account. Pinned to the
  # broker minimum so every entry is the smallest possible size.
  min_lot: 0.01
  max_lot: 0.01
  # Daily loss limit (% of starting-of-day balance). Tightened for the
  # small account: stop trading for the day after a 10% drawdown.
  max_daily_loss_pct: 10.0

strategy:
  # Built-in strategy: EMA crossover filtered by RSI.
  name: "ema_rsi"
  fast_ema: 12
  slow_ema: 26
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  # Number of historical bars to pull each evaluation.
  history_bars: 500

# ----------------------------------------------------------------
# Multiple entries: keep adding positions in the trend direction
# (scale in), spaced out over time, up to max_open_positions.
# Kept conservative for the small cent account so stacked gold
# positions can't blow it up.
# ----------------------------------------------------------------
entries:
  pyramid: true              # add more entries along the trend
  spacing_bars: 6            # wait more bars between added entries
  reverse_on_opposite: false # don't force-close when the signal flips

# ----------------------------------------------------------------
# Exits: as soon as a position has earnings, close it.
# Values are in your ACCOUNT CURRENCY, which on a cent account is
# CENTS. e.g. min_profit_money: 5.0 = close once a trade is +5 cents.
# ----------------------------------------------------------------
exit:
  close_in_profit: true      # close each position once it's in profit
  min_profit_money: 5.0      # close a trade once it is +5 cents (clears spread)
  # If > 0, close ALL positions together once their combined floating
  # profit reaches this many cents. 0 disables.
  basket_profit_money: 0.0

runtime:
  # If true the bot only logs the signals it WOULD take and never
  # sends a single real order. Always start here.
  dry_run: true
  log_level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  log_file: "bot.log"

# ----------------------------------------------------------------
# Control & monitor the bot from your PHONE via Telegram.
# Run telegram_bot.py on your always-on PC/VPS, then use the
# Telegram app on your phone to /run, /stop, /status, /closeall
# and to receive an alert on every trade.
# ----------------------------------------------------------------
telegram:
  enabled: false
  # From @BotFather. Prefer the TELEGRAM_TOKEN env var over writing
  # the token here.
  token:
  # Your personal chat id (only this chat can control the bot).
  chat_id:
  # If true, auto-trading does NOT start until you send /run from
  # your phone. Recommended so you stay in control.
  start_paused: true
